<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-page: #0B1120;
      --bg-surface: #131B2F;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-cyan: #06B6D4;
      --font-display: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      padding: 60px 80px;
      position: relative;
      font-family: var(--font-display);
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 60px;
    }
    .title-line {
      width: 120px;
      height: 4px;
      background: var(--accent-cyan);
      margin-bottom: 30px;
    }
    h1 {
      font-size: 64px;
      line-height: 1.1;
      font-weight: 700;
      max-width: 900px;
    }
    p.summary {
      margin-top: 24px;
      font-size: 24px;
      color: var(--text-muted);
      max-width: 700px;
      line-height: 1.4;
    }
    .footer {
      position: absolute;
      bottom: 40px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-muted);
    }
    .brand-mono { font-family: var(--font-code); color: var(--accent-cyan); }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <div class="title-line"></div>
      <h1>Supabase Auth + Storage<br>no App Android SWE</h1>
      <p class="summary">Como transformar o acesso existente em uma integração reutilizável, segura e observável entre Web e Mobile.</p>
    </div>
    <div class="footer">
      <span>MWC / UMS · Supabase integration</span>
      <span class="brand-mono">SLIDE 01</span>
    </div>
  </div>
</body>
</html>
