name: MWC Storage Node tests

on:
  push:
    branches: [main]
    paths:
      - "node-agent/**"
      - ".github/workflows/mwc-node-agent-tests.yml"
  pull_request:
    paths:
      - "node-agent/**"
      - ".github/workflows/mwc-node-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run storage node tests
        working-directory: node-agent
        run: python -m unittest -v test_mwc_node.py
